name: Daily Hot Emoji

on:
  schedule:
    # 每天 22:10 UTC = 北京时间 06:10（GitHub Actions 的 cron 是 UTC 时间）
    - cron: '10 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-hot-emoji
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 本项目只用 Python 标准库，不需要 pip install，因此不启用 pip 缓存，
          # 进一步减少 Actions 分钟数和依赖风险。

      - name: Collect and generate report
        run: python scripts/collect.py --top 30 --keep-days 30

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily hot emoji $(date -u +%Y-%m-%d)"
            git push
          fi
